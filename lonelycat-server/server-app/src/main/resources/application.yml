# 服务端配置
server:
  port: 9090

spring:
  application:
    name: lonelycat-server

  # 第一版用 H2 文件数据库，零安装即可运行。数据文件在 ./data/lonelycat.mv.db
  # 换成 PostgreSQL 只需要改 url / driver / dialect，并在 pom.xml 里换驱动依赖。
  datasource:
    url: jdbc:h2:file:./data/lonelycat;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update        # 开发阶段自动建表，生产环境建议换成 Flyway / Liquibase
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # 开发调试可以打开 /h2-console 查看数据
  h2:
    console:
      enabled: true
      path: /h2-console

lonelycat:
  # 每累计多少个操作就把文档内容写一次快照，重启时只需从快照之后重放操作
  snapshot-interval: 20
  # 允许跨域的前端来源（开发阶段放开）
  allowed-origins: "*"

logging:
  level:
    com.lonelycat: INFO
